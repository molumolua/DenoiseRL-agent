hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: left

reward_model:
  reward_manager: episode

actor_rollout_ref:
  rollout:
    n: 1

traj_collector:
  custom_cls:
    path: recipe/alfworld_denoise/collector.py
    name: DenoiseTrajectoryCollector

env:
  env_name: alfworld/AlfredTWEnv
  max_steps: 50
  history_length: 4
  rollout:
    # Must equal env.denoise.main_rollout_n + env.denoise.sub_rollout_k.
    n: 8
  denoise:
    enable: True
    main_rollout_n: 4
    sub_rollout_k: 4
    prefix_pool_path: null
    min_prefix_steps: 1
    max_prefix_steps: 6
    prefix_seed: ${env.seed}
    require_failed_prefixes: True

algorithm:
  adv_estimator: grpo
  filter_groups:
    enable: False
    max_num_gen_batches: 10

trainer:
  project_name: alfworld-denoise
